<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, initial-scale=1.0">
  <title>SOS WiFi Screenshot</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      width: 1080px;
      height: 1920px;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #2c343d 0%, #232a31 45%, #1a2027 75%, #11171e 100%);
      font-family: 'Inter', sans-serif;
    }

    .card {
      border: 2px solid #FF6A1A;
      border-radius: 32px;
      padding: 40px;
      background: rgba(24,24,27,0.95);
      width: 80%;
      text-align: center;
    }

    .logo {
      font-size: 80px;
      font-weight: bold;
      color: #FF6A1A;
    }

    .tagline {
      color: #FF6A1A;
      letter-spacing: 4px;
      margin-bottom: 40px;
    }

    .price {
      font-size: 100px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">
    
    <div class="logo">S🛟S</div>
    <div class="text-2xl mb-4">WI-FI</div>

    <div class="tagline">YOUR INTERNET LIFELINE</div>

    <div class="text-amber-300 mb-2">GOLD</div>
    <div class="price text-white">£10</div>
    <div class="text-zinc-400 mb-8">15 Mbps • 20 minutes</div>

    <div class="text-left mx-auto max-w-sm space-y-3 text-zinc-200">
      <div>✔ Streaming & video calls</div>
      <div>✔ YouTube & live streams</div>
      <div>✔ Multiple devices</div>
    </div>

  </div>

</body>
</html>
