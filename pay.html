<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Continue Payment</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-zinc-900 text-white min-h-screen flex items-center justify-center">

  <div class="max-w-md w-full px-6 py-10 bg-zinc-800/80 rounded-3xl text-center shadow-xl border border-orange-500/30">

    <h1 class="text-2xl font-bold mb-4 text-orange-400">
      Continue to Payment
    </h1>

    <p class="text-zinc-400 mb-8 text-sm">
      Tap below to open secure payment page
    </p>

    <a id="payLink"
       class="block w-full py-4 bg-orange-500/20 hover:bg-orange-500/30 border border-orange-500 text-white font-semibold rounded-2xl transition-all">
       Continue to Pay • Secure
    </a>

    <p class="text-xs text-zinc-500 mt-6">
      Secure checkout powered by Stripe
    </p>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const plan = params.get("plan");
    const mac = params.get("mac");
    const ip = params.get("ip");

    const priceMap = {
      basic: "price_1TM8LkF9howUJR6PV4Ezswak",
      standard: "price_1TM8LkF9howUJR6PDVPAl0qe",
      deluxe: "price_1TM8LkF9howUJR6PlQUXWWkr"
    };

    const priceId = priceMap[plan];

    if (!priceId || !mac) {
      document.getElementById("payLink").innerText = "Invalid session. Please reconnect.";
    } else {
      document.getElementById("payLink").href =
        `/api/create-checkout-session?priceId=${encodeURIComponent(priceId)}&mac=${encodeURIComponent(mac)}&ip=${encodeURIComponent(ip || "")}`;
    }
  </script>

</body>
</html>
